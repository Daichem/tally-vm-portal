name: Deploy web portal

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "scripts/create-runtime-config.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy GitHub Pages
    if: >-
      ${{ vars.ENTRA_TENANT_ID != '' &&
          vars.ENTRA_SPA_CLIENT_ID != '' &&
          vars.API_BASE_URL != '' &&
          vars.ENTRA_API_SCOPE != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web application
        run: pnpm --filter @daichem/tally-vm-web build

      - name: Create non-secret browser configuration
        env:
          ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          ENTRA_SPA_CLIENT_ID: ${{ vars.ENTRA_SPA_CLIENT_ID }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          ENTRA_API_SCOPE: ${{ vars.ENTRA_API_SCOPE }}
        run: node scripts/create-runtime-config.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
