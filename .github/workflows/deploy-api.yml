name: Deploy Azure Function API

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-function-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy API with GitHub OIDC
    if: >-
      ${{ vars.AZURE_DEPLOY_CLIENT_ID != '' &&
          vars.AZURE_TENANT_ID != '' &&
          vars.AZURE_SUBSCRIPTION_ID != '' &&
          vars.AZURE_FUNCTIONAPP_NAME != '' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate API
        run: pnpm --filter @daichem/tally-vm-api test

      - name: Create isolated production package
        run: pnpm --config.node-linker=hoisted --filter @daichem/tally-vm-api deploy --prod --legacy .azure-package

      - name: Verify production package
        run: |
          test ! -L .azure-package/node_modules/@azure/functions
          test ! -L .azure-package/node_modules/@azure/identity
          test ! -L .azure-package/node_modules/jose
          node --input-type=module -e "await import('./.azure-package/src/functions/vms.js')"

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy function application
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: .azure-package
